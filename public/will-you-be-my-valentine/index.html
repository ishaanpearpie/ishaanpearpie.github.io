<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="sticker">
      <img src="https://img.icons8.com/?size=100&id=vmquCWYXVo3I&format=png&color=000000" alt="cute bear">
    </div>
    <h1>Will you be my Valentine<br>Drishti Mishra? <i class="fas fa-heart" style="color: #ff4d6d;"></i></h1>

    <div class="buttons">
      <button id="yesBtn">Yes <i class="fas fa-heart"></i></button>
      <button id="noBtn">No <i class="far fa-sad-tear"></i></button>
    </div>
  </div>

  <div id="popup" class="hidden">
    <div class="popup-content">
      <h2>YAAAY!!! <i class="fas fa-heart" style="color: #ff1493;"></i><i class="fas fa-heart" style="color: #ff69b4;"></i><i class="fas fa-heart" style="color: #ff1493;"></i></h2>
      <p>Avi is super duper happy! <i class="fas fa-paw" style="color: #ff4d6d;"></i><i class="fas fa-heart" style="color: #ff4d6d;"></i></p>
      <p>My valentine for the 4th year of my life!!!</p>
      <p>Can't wait to see you. <i class="fas fa-heart-circle" style="color: #ff69b4;"></i></p>
      <div class="countdown">
        <p id="countdownText"></p>
      </div>
      <div class="flowers">
        <i class="fas fa-spa"></i>
        <i class="fas fa-seedling"></i>
        <i class="fas fa-leaf"></i>
        <i class="fas fa-spa"></i>
        <i class="fas fa-seedling"></i>
        <i class="fas fa-leaf"></i>
      </div>
    </div>
  </div>
  
  <!-- Floating hearts -->
  <div class="heart-float"><i class="fas fa-heart"></i></div>
  <div class="heart-float"><i class="fas fa-heart"></i></div>
  <div class="heart-float"><i class="fas fa-heart"></i></div>
  <div class="heart-float"><i class="fas fa-heart"></i></div>
  <div class="heart-float"><i class="fas fa-heart"></i></div>

  <script src="script.js"></script>
</body>
</html>
